# /.github/workflows/ci_cd.yml

# Workflow name displayed in GitHub Actions UI
name: Fetch Germany Weather

# Trigger workflow every hour and allow manual trigger
on:
  # Automated schedule: runs at 20 minutes past every hour
  schedule:
    - cron: "20 * * * *"
  # Manual trigger: allows running the workflow from GitHub UI
  workflow_dispatch:

jobs:
  fetch_weather:
    # Use Ubuntu 22.04 as the runner environment
    runs-on: ubuntu-22.04

    # Prevent multiple instances from running simultaneously
    concurrency:
      group: fetch-weather
      cancel-in-progress: true

    steps:
      # Step 1: Clone the repository to the runner
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python environment
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # Step 3: Install project dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Execute the main weather fetching script
      - name: Run main.py
        env:
          # Pass OpenWeather API key from GitHub secrets
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          # Pass MongoDB connection string from GitHub secrets
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python main.py